<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Personnel Admin Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="page-width header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark" aria-hidden="true">BC</span>
        <span>Baltimore City Sheriff’s Office<small>Personnel Admin Portal</small></span>
      </a>
      <nav class="site-nav" aria-label="Portal">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Personnel</a>
        <a href="{{ url_for('inventory_page') }}"{% if request.endpoint in ['inventory_page', 'change_inventory'] %} aria-current="page"{% endif %}>Inventory</a>
      </nav>
    </div>
  </header>
  <main class="page-width">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
