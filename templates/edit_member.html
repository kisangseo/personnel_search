<section class="member-form">
  <h3>Edit member</h3>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('edit_member', employee_id=employee_id) }}">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <input type="hidden" name="revision" value="{{ revision }}">
    <div class="dialog-fields">
    {% for field, label, limit in fields %}
      {% set value = values[field] or "" %}
      <label>{{ label }}
        {% if field in options %}
          <select name="{{ field }}">
            <option value=""{% if not value %} selected{% endif %}></option>
            {% if value and value not in options[field] %}<option selected>{{ value }}</option>{% endif %}
            {% for option in options[field] %}
              <option{% if option == value %} selected{% endif %}>{{ option }}</option>
            {% endfor %}
          </select>
        {% elif field == "notes" %}
          <textarea name="{{ field }}" rows="3">{{ value }}</textarea>
        {% else %}
          <input name="{{ field }}" value="{{ value }}" maxlength="{{ limit }}">
        {% endif %}
      </label>
    {% endfor %}
    </div>
    <div class="dialog-actions">
      <button type="button" data-cancel-edit>Cancel</button>
      <button class="primary" type="submit">Save changes</button>
    </div>
  </form>
</section>
